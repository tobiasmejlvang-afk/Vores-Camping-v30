<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2f5d45" />
  <meta name="description" content="Vores Camping – personlig camping-, ferie- og mindeapp" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./assets/icon-192.png" />
  <link rel="apple-touch-icon" href="./assets/icon-192.png" />
  <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="./styles.css" />
  <title>Vores Camping</title>
</head>
<body>
  <div id="appShell" class="app-shell">
    <header class="topbar">
      <a href="#/overblik" class="brand" aria-label="Vores Camping – Overblik">
        <img src="./assets/app-icon.webp" alt="" class="brand-icon" />
        <div><strong>Vores Camping</strong><span>Camping · ferie · minder</span></div>
      </a>
      <nav id="topNav" class="top-nav" aria-label="Hovednavigation"></nav>
      <div class="top-actions">
        <button class="icon-btn" id="globalSearchBtn" title="Find campingplads" aria-label="Find campingplads"><i data-lucide="search"></i></button>
        <button class="icon-btn" id="quickAddBtn" title="Tilføj" aria-label="Tilføj"><i data-lucide="plus"></i></button>
        <button class="icon-btn mobile-menu-btn" id="mobileMenuBtn" title="Menu" aria-label="Menu"><i data-lucide="menu"></i></button>
      </div>
    </header>

    <aside id="sideRail" class="side-rail" aria-label="Hurtige handlinger">
      <div class="side-rail-title">Hurtigt</div>
      <button data-action="find-camp"><i data-lucide="search"></i><span>Find campingplads</span></button>
      <button data-action="add-camp-menu"><i data-lucide="map-pin-plus"></i><span>Tilføj campingplads</span></button>
      <button data-action="new-route"><i data-lucide="route"></i><span>Ny rute</span></button>
      <button data-action="add-experience"><i data-lucide="sparkles"></i><span>Oplevelse</span></button>
      <button data-action="add-attraction"><i data-lucide="landmark"></i><span>Seværdighed</span></button>
      <button data-action="add-photo"><i data-lucide="image-plus"></i><span>Upload billeder</span></button>
      <button data-action="add-note"><i data-lucide="notebook-pen"></i><span>Tilføj notat</span></button>
      <button data-action="start-vacation"><i data-lucide="palmtree"></i><span>Start ferie</span></button>
      <button data-action="open-map"><i data-lucide="map"></i><span>Stort kort</span></button>
    </aside>

    <main id="mainContent" class="main-content" tabindex="-1"></main>
  </div>

  <div id="mobileDrawer" class="drawer" aria-hidden="true"><div class="drawer-backdrop" data-close-drawer></div><div class="drawer-panel"><div class="drawer-head"><strong>Vores Camping</strong><button class="icon-btn" data-close-drawer><i data-lucide="x"></i></button></div><nav id="mobileNav"></nav></div></div>
  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>
  <input id="hiddenImageInput" type="file" accept="image/*" multiple hidden />
  <input id="hiddenImportInput" type="file" accept="application/json,.json" hidden />

  <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
